<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ココロ♡のコ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #71c385;
      color: #4a3e3d;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .header-gradient {
      background: linear-gradient(180deg, #f5a373 0%, #f9d8bc 70%, rgba(249, 216, 188, 0) 100%);
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }
    .floating-element {
      animation: floatSlow 3.5s ease-in-out infinite;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #e0bba8;
      border-radius: 4px;
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .speech-bubble {
      position: relative;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      border: 1px solid #e2f0e5;
    }

    /* 動物＋表情レイヤー重ね合わせスタイル */
    .creature-container {
      position: relative;
      display: inline-block;
      width: 64px;
      height: 64px;
    }
    .creature-base-img, .creature-face-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .creature-face-img {
      z-index: 2;
    }

    /* カレンダー用アイコン（小） */
    .creature-container-sm {
      position: relative;
      display: inline-block;
      width: 20px;
      height: 20px;
    }

    /* ロゴ画像スタイル */
    .logo-img {
      max-width: 220px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-[#71c385]">

  <div id="app-wrapper" class="w-full max-w-md bg-[#71c385] min-h-screen flex flex-col justify-between shadow-2xl relative overflow-hidden">

    <!-- ヘッダー (ロゴ.png) -->
    <header class="header-gradient pt-4 pb-2 px-4 text-center z-10 sticky top-0 flex flex-col items-center justify-center">
      <img src="ロゴ.png" alt="ココロのコ" class="logo-img" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'text-2xl font-black text-[#7a4838]\'>ココロ♡のコ</div>';">
    </header>

    <!-- メインコンテンツ -->
    <main id="main-content" class="flex-1 relative overflow-y-auto pb-24 bg-[#71c385]">

      <!-- ================= TL（タイムライン） ================= -->
      <section id="tab-tl" class="min-h-full bg-[#71c385] p-4 flex flex-col items-center">
        <!-- 物理的に重ならない縦ストリームエリア -->
        <div id="tl-stream" class="w-full flex flex-col gap-4 mt-2"></div>
      </section>

      <!-- ================= 記録 ================= -->
      <section id="tab-record" class="hidden min-h-full bg-[#fdfbf7] p-5 flex flex-col gap-5">
        
        <div class="text-center my-2">
          <p class="text-lg font-medium text-[#73584c]">どんなことがありましたか？</p>
          <p class="text-xs text-[#a08a7e] mt-1">短くても長くなっても大丈夫です</p>
        </div>

        <div class="bg-white/90 border border-[#eddcd2] rounded-2xl p-3 shadow-sm">
          <textarea id="diary-input" rows="3" 
            placeholder="今日あったことやメモを書いてみよう..." 
            class="w-full bg-transparent resize-none border-none focus:outline-none text-sm text-[#4a3e3d] placeholder-[#c4b2a8]"></textarea>
        </div>

        <!-- 気持ちの選択 ＆ 1〜5段階スライダー -->
        <div class="bg-white/80 border border-[#f0e3da] rounded-2xl p-4 shadow-sm">
          <p class="text-sm font-bold text-[#6b5246] mb-1 text-center">どんな気持ちでしたか？</p>
          <p class="text-[11px] text-[#a08a7e] mb-3 text-center">当てはまる感情にチェックを入れて、強さ（1〜5）を選んでね</p>
          
          <div id="emotions-container" class="flex flex-col gap-2.5">
            <!-- JSで動的に感情行（チェックボックス＋スライダー 1〜5）を生成 -->
          </div>
        </div>

        <div class="flex items-center justify-center gap-2 py-1">
          <input type="checkbox" id="is-public" checked class="w-4 h-4 accent-[#e88873] rounded cursor-pointer">
          <label for="is-public" class="text-sm font-medium text-[#6e584c] cursor-pointer">詳しい内容を公開する</label>
        </div>

        <button onclick="submitRecord()" class="w-2/3 mx-auto bg-[#eba496] text-white font-bold py-3 px-6 rounded-full shadow-md hover:bg-[#e49283] active:scale-95 transition text-center tracking-wider mt-2">
          記録
        </button>

      </section>

      <!-- ================= 過去 (カレンダー) ================= -->
      <section id="tab-history" class="hidden min-h-full bg-[#fdfbf7] p-4">
        
        <div class="text-center mb-3">
          <h2 class="text-lg font-bold text-[#6b5246] tracking-wide">カレンダー</h2>
        </div>

        <div class="bg-[#ebdcd5]/70 border border-[#e2cfc7] rounded-2xl p-4 shadow-sm">
          
          <div class="flex justify-between items-center mb-4 px-2">
            <span id="calendar-month-title" class="text-md font-bold text-[#5e493e]">2026年 10月</span>
            <div class="flex gap-2">
              <button onclick="changeMonth(-1)" class="text-xs bg-white/90 border border-[#d9c4ba] px-3 py-1.5 rounded-lg text-[#6e584c] shadow-xs hover:bg-white active:scale-95 transition font-bold">先月</button>
              <button onclick="changeMonth(1)" class="text-xs bg-white/90 border border-[#d9c4ba] px-3 py-1.5 rounded-lg text-[#6e584c] shadow-xs hover:bg-white active:scale-95 transition font-bold">来月</button>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-[#8a7266] mb-2">
            <span class="text-rose-400">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-sky-400">土</span>
          </div>

          <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>

        </div>

        <div id="day-detail-container" class="mt-4 flex flex-col gap-2">
          <div class="bg-white border border-[#ebd8ce] rounded-2xl p-4 shadow-sm text-center">
            <p class="text-xs text-[#a08a7e]">日付をタップするとその日のすべての記録が見られます</p>
          </div>
        </div>

      </section>

    </main>

    <!-- ボトムナビゲーション -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md h-16 bg-[#e0c9bc] flex justify-between items-stretch z-30 shadow-lg border-t border-[#d4b9ab]">
      <button id="nav-tl" onclick="switchTab('tl')" class="flex-1 flex items-center justify-center font-bold text-lg text-[#3e5343] transition-all bg-[#8bc99c]">
        TL
      </button>
      <button id="nav-record" onclick="switchTab('record')" class="flex-1 flex items-center justify-center font-bold text-lg text-[#52332a] transition-all bg-[#e38571]">
        記録
      </button>
      <button id="nav-history" onclick="switchTab('history')" class="flex-1 flex items-center justify-center font-bold text-lg text-[#574943] transition-all bg-[#d8c3b7]">
        過去
      </button>
    </nav>

    <!-- 誕生演出モーダル -->
    <div id="birth-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl animate-pop border border-[#edd3c5] flex flex-col items-center">
        <h3 class="text-lg font-bold text-[#73584c] mb-1">ココロノコが誕生！</h3>
        <div id="modal-creature-wrapper" class="my-4 floating-element flex justify-center">
          <!-- JSで動物＋表情レイヤーを挿入 -->
        </div>
        <p id="modal-text" class="text-sm text-[#5a483e] font-medium mb-1">「何やら新しいココロが生まれたよ」</p>
        <p id="modal-emotions" class="text-xs text-[#9c8477] mb-4"></p>
        <button onclick="closeModal()" class="w-full bg-[#e88873] text-white font-bold py-2.5 rounded-xl shadow hover:bg-[#e07761] transition">
          みんなのもとへ放つ
        </button>
      </div>
    </div>

  </div>

  <script>
    // 6種類の動物ベース画像
    const ANIMAL_BASES = ["いぬ", "うさぎ", "くま", "とら", "オオカミ", "リス"];

    // 選択可能な感情（※「ほっこり」は削除済み）
    const EMOTION_TYPES = [
      "うれしい", "かなしい", "たのしい", "わくわく", "むかつく",
      "あんしん", "もやもや", "ゆううつ", "くるしい", "はずかしい"
    ];

    let currentYear = 2026;
    let currentMonth = 10;
    const TODAY_KEY = "2026-10-25";

    // 表情レイヤーマッピング（感情から対応する画像名を取得）
    function getFaceImageName(emotions) {
      if (!emotions || emotions.length === 0) {
        return "ふくざつ.png"; // 未選択時の言い表せない複雑な感情
      }

      // 最も強さ(val)が高い感情、または一番目の感情を取得
      let mainEmotion = emotions[0];
      if (typeof mainEmotion === 'object' && mainEmotion.name) {
        let maxVal = -1;
        emotions.forEach(e => {
          if (e.val > maxVal) {
            maxVal = e.val;
            mainEmotion = e.name;
          }
        });
      }

      const emoStr = typeof mainEmotion === 'string' ? mainEmotion : mainEmotion.name;

      if (["うれしい", "たのしい", "わくわく","あんしん"].includes(emoStr)) {
        return "うれしい.png";
      } else if (["もやもや", "ゆううつ"].includes(emoStr)) {
        return "もやもや.png";
      } else if (["くるしい", "かなしい"].includes(emoStr)) {
        return "かなしい.png";
      } else if (emoStr === "はずかしい") {
        return "はずかしい.png";
      } else if (emoStr === "むかつく") {
        return "むかつく.png";
      }

      return "もやもや.png";
    }

    // 会話要約文（感情未選択時の「言い表せない複雑な感情」ニュアンス対応）
    function getSummaryText(emotions) {
      if (!emotions || emotions.length === 0) {
        return "言葉にならない、少し複雑なココロを感じているみたい";
      }

      const emotionNames = emotions.map(e => typeof e === 'string' ? e : e.name);

      if (emotionNames.includes("かなしい") || emotionNames.includes("ゆううつ") || emotionNames.includes("くるしい")) {
        return "何やら悲しいことがあったみたい";
      } else if (emotionNames.includes("うれしい") || emotionNames.includes("たのしい") || emotionNames.includes("わくわく")) {
        return "何やら嬉しいことがあったみたい";
      } else if (emotionNames.includes("もやもや") || emotionNames.includes("むかつく")) {
        return "何やらモヤモヤしているみたい";
      } else if (emotionNames.includes("はずかしい")) {
        return "何やら照れているみたい";
      } else if (emotionNames.includes("あんしん")) {
        return "ほっと一安心しているみたい";
      }

      return "言葉にならない、少し複雑なココロを感じているみたい";
    }

    // 動物ベース＋表情レイヤーHTML構築関数
    function renderCreatureHtml(animalBase, faceImgName, sizeClass = "creature-container") {
      const baseSrc = `${animalBase}.png`;
      const faceSrc = faceImgName;

      return `
        <div class="${sizeClass}">
          <img src="${baseSrc}" alt="${animalBase}" class="creature-base-img" onerror="this.style.display='none'; this.nextElementSibling.style.position='static';">
          <img src="${faceSrc}" alt="表情" class="creature-face-img" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><text y=\'70\' font-size=\'70\'>🐱</text></svg>';">
        </div>
      `;
    }

    // サンプル投稿データ
    let posts = [
      { id: 1, text: "課題で少しミスをして落ち込んだ...", emotions: [{name:"かなしい", val:4}, {name:"ゆううつ", val:3}], animal: "オオカミ", isPublic: true, isMine: false, likes: 0, likedCreatures: [], date: "2026-10-24 14:20", align: "left" },
      { id: 2, text: "夕方の空がとってもキレイだった！", emotions: [{name:"あんしん", val:5}], animal: "いぬ", isPublic: true, isMine: true, likes: 3, likedCreatures: ["リス", "うさぎ", "くま"], date: "2026-10-25 17:30", align: "left" },
      { id: 3, text: "なんだか理由も分からずぼんやり考えごと...", emotions: [], animal: "くま", isPublic: false, isMine: false, likes: 1, likedCreatures: ["いぬ"], date: "2026-10-25 08:00", align: "right" },
      { id: 4, text: "欲しかった本を手に入れた！読むのが楽しみ", emotions: [{name:"わくわく", val:5}], animal: "うさぎ", isPublic: true, isMine: false, likes: 2, likedCreatures: ["とら", "リス"], date: "2026-10-25 09:15", align: "right" }
    ];

    // 過去カレンダー用履歴データ
    let historyRecords = {
      "2026-08-10": [{ text: "夏休みのドライブに行ってきた！海がきれいだった", emotions: [{name:"たのしい", val:5}, {name:"わくわく", val:4}], animal: "とら", likes: 4, time: "14:00" }],
      "2026-08-15": [{ text: "かき氷を食べた。すごく冷たくて夏を感じた！", emotions: [{name:"うれしい", val:4}], animal: "リス", likes: 2, time: "16:20" }],
      "2026-08-28": [{ text: "夏休みの宿題がまだ終わらなくて焦ってきた...", emotions: [{name:"ゆううつ", val:4}, {name:"くるしい", val:3}], animal: "オオカミ", likes: 1, time: "21:00" }],
      "2026-09-05": [{ text: "秋の風が少し吹き始めて気持ちいい", emotions: [{name:"あんしん", val:4}], animal: "いぬ", likes: 3, time: "17:40" }],
      "2026-09-12": [{ text: "欲しかった洋服を買いに行けた！", emotions: [{name:"うれしい", val:5}, {name:"たのしい", val:4}], animal: "うさぎ", likes: 5, time: "13:10" }],
      "2026-09-20": [{ text: "夜遅くまでプログラミングの練習をした", emotions: [{name:"もやもや", val:2}, {name:"わくわく", val:4}], animal: "くま", likes: 2, time: "23:15" }],
      "2026-09-27": [{ text: "友だちとカラオケに行って大声で歌った！", emotions: [{name:"たのしい", val:5}], animal: "とら", likes: 6, time: "19:30" }],
      "2026-10-15": [{ text: "久しぶりにカフェでゆっくり読書した", emotions: [{name:"あんしん", val:4}], animal: "リス", likes: 2, time: "15:00" }],
      "2026-10-18": [{ text: "新しい曲を聴いて気分が上がった！", emotions: [{name:"たのしい", val:5}], animal: "いぬ", likes: 4, time: "11:20" }],
      "2026-10-21": [{ text: "ちょっと失敗してモヤモヤした日", emotions: [{name:"もやもや", val:3}], animal: "くま", likes: 1, time: "20:10" }],
      "2026-10-22": [{ text: "散歩中に可愛い野良猫に出会えた", emotions: [{name:"うれしい", val:4}], animal: "うさぎ", likes: 3, time: "16:45" }],
      "2026-10-24": [{ text: "課題で少しミスをして落ち込んだ...", emotions: [{name:"かなしい", val:4}, {name:"ゆううつ", val:3}], animal: "オオカミ", likes: 0, time: "14:20" }],
      "2026-10-25": [
        { text: "夕方の空がとってもキレイだった！", emotions: [{name:"あんしん", val:5}], animal: "いぬ", likes: 3, time: "17:30" },
        { text: "なんだか理由も分からずぼんやり考えごと...", emotions: [], animal: "くま", likes: 1, time: "08:00" },
        { text: "欲しかった本を手に入れた！読むのが楽しみ", emotions: [{name:"わくわく", val:5}], animal: "うさぎ", likes: 2, time: "09:15" }
      ]
    };

    function initEmotionInputs() {
      const container = document.getElementById('emotions-container');
      container.innerHTML = '';

      EMOTION_TYPES.forEach((emo, idx) => {
        const row = document.createElement('div');
        row.className = "flex items-center justify-between gap-2 p-2 rounded-xl bg-[#fbf6f1] border border-[#f5e9df]";
        
        row.innerHTML = `
          <label class="flex items-center gap-2 cursor-pointer shrink-0 w-28">
            <input type="checkbox" id="check-emo-${idx}" value="${emo}" onchange="toggleSlider(${idx})" class="emotion-check accent-[#ee8572] w-4 h-4">
            <span class="text-sm font-medium text-[#5a483e]">${emo}</span>
          </label>
          <div class="flex items-center gap-2 flex-1 opacity-40 transition-opacity" id="slider-box-${idx}">
            <input type="range" id="range-emo-${idx}" min="1" max="5" value="3" disabled oninput="updateVal(${idx})" class="w-full accent-[#e88873] h-1.5 bg-[#ebdcd5] rounded-lg appearance-none cursor-pointer">
            <span id="val-emo-${idx}" class="text-xs font-bold text-[#73584c] w-4 text-right">3</span>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function toggleSlider(idx) {
      const checked = document.getElementById(`check-emo-${idx}`).checked;
      const box = document.getElementById(`slider-box-${idx}`);
      const range = document.getElementById(`range-emo-${idx}`);
      
      if (checked) {
        box.classList.remove('opacity-40');
        range.disabled = false;
      } else {
        box.classList.add('opacity-40');
        range.disabled = true;
      }
    }

    function updateVal(idx) {
      const val = document.getElementById(`range-emo-${idx}`).value;
      document.getElementById(`val-emo-${idx}`).innerText = val;
    }

    function switchTab(tabName) {
      const main = document.getElementById('main-content');
      const wrapper = document.getElementById('app-wrapper');

      document.getElementById('tab-tl').classList.add('hidden');
      document.getElementById('tab-record').classList.add('hidden');
      document.getElementById('tab-history').classList.add('hidden');

      document.getElementById('nav-tl').className = "flex-1 flex items-center justify-center font-bold text-lg transition-all bg-[#a1d6b0] text-[#3e5343] opacity-80";
      document.getElementById('nav-record').className = "flex-1 flex items-center justify-center font-bold text-lg transition-all bg-[#ebd0c7] text-[#52332a] opacity-80";
      document.getElementById('nav-history').className = "flex-1 flex items-center justify-center font-bold text-lg transition-all bg-[#ebd0c7] text-[#574943] opacity-80";

      if (tabName === 'tl') {
        document.getElementById('tab-tl').classList.remove('hidden');
        document.getElementById('nav-tl').className = "flex-1 flex items-center justify-center font-bold text-lg transition-all bg-[#71c385] text-white shadow-inner";
        main.style.backgroundColor = '#71c385';
        wrapper.style.backgroundColor = '#71c385';
        renderTL();
      } else if (tabName === 'record') {
        document.getElementById('tab-record').classList.remove('hidden');
        document.getElementById('nav-record').className = "flex-1 flex items-center justify-center font-bold text-lg transition-all bg-[#eba496] text-white shadow-inner";
        main.style.backgroundColor = '#fdfbf7';
        wrapper.style.backgroundColor = '#fdfbf7';
      } else if (tabName === 'history') {
        document.getElementById('tab-history').classList.remove('hidden');
        document.getElementById('nav-history').className = "flex-1 flex items-center justify-center font-bold text-lg transition-all bg-[#c2a99b] text-white shadow-inner";
        main.style.backgroundColor = '#fdfbf7';
        wrapper.style.backgroundColor = '#fdfbf7';
        renderCalendar();
      }
    }

    function renderTL() {
      const stream = document.getElementById('tl-stream');
      stream.innerHTML = '';

      const sortedPosts = [...posts].sort((a, b) => a.likes - b.likes);

      sortedPosts.forEach((post, index) => {
        const row = document.createElement('div');
        row.className = `w-full flex ${post.align === 'right' ? 'justify-end' : 'justify-start'} my-1`;

        const wrapper = document.createElement('div');
        wrapper.className = "flex flex-col items-center max-w-[85%] floating-element cursor-pointer";
        wrapper.style.animationDelay = `${(index % 3) * 0.8}s`;

        const summaryText = getSummaryText(post.emotions);
        const faceImgName = getFaceImageName(post.emotions);

        const bubble = document.createElement('div');
        bubble.className = "speech-bubble text-[#4a3e3d] text-xs font-bold px-3.5 py-2.5 shadow-md w-full text-center mb-1 flex flex-col gap-1.5";

        const heartDisplay = post.isMine ? `♡ <span class="ml-1">${post.likes}</span>` : `♡`;

        const publicIndicator = post.isPublic 
          ? `<div class="text-[10px] text-[#8a9a86] font-normal flex items-center justify-center gap-1 mt-0.5"><span>タップで表示</span><span class="text-[9px]">▼</span></div>` 
          : `<div class="text-[10px] text-[#a08a7e] font-normal flex items-center justify-center gap-1 mt-0.5"><span>🔒 秘密の記録</span></div>`;

        const emoTagsHtml = post.emotions && post.emotions.length > 0 
          ? post.emotions.map(e => {
              const name = typeof e === 'string' ? e : e.name;
              const val = typeof e === 'string' ? '' : `:${e.val}`;
              return `<span class="text-[10px] bg-[#f7eae1] text-[#785d50] px-1.5 py-0.5 rounded">#${name}${val}</span>`;
            }).join('')
          : `<span class="text-[10px] bg-[#f0e8e2] text-[#8a7a70] px-1.5 py-0.5 rounded">#と言葉にならない気持ち</span>`;

        bubble.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="text-left leading-relaxed">${summaryText}</span>
            <button onclick="likePost(event, ${post.id})" class="text-rose-400 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-full transition flex items-center text-[11px] font-bold shrink-0">
              ${heartDisplay}
            </button>
          </div>
          ${publicIndicator}
          <div id="detail-${post.id}" class="hidden text-left pt-2 border-t border-black/5 text-xs font-normal text-[#5a483e] animate-pop">
            <p class="mb-1 leading-relaxed">${post.text}</p>
            <div class="flex flex-wrap gap-1 mt-1">
              ${emoTagsHtml}
            </div>
          </div>
        `;

        if (post.likedCreatures && post.likedCreatures.length > 0) {
          const recentLikes = post.likedCreatures.slice(-4);
          const likesListHtml = recentLikes.map(animalName => `<span class="bg-white/80 rounded-full px-1 shadow-xs text-xs">${animalName}</span>`).join('');
          
          const likesContainer = document.createElement('div');
          likesContainer.className = "flex items-center justify-end gap-1 pt-1 border-t border-black/5 text-[10px] text-[#71584c]";
          likesContainer.innerHTML = `<span class="opacity-75">共感:</span> <div class="flex gap-0.5">${likesListHtml}</div>`;
          bubble.appendChild(likesContainer);
        }

        const creatureWrapper = document.createElement('div');
        creatureWrapper.className = "mt-0.5";
        creatureWrapper.innerHTML = renderCreatureHtml(post.animal, faceImgName);

        wrapper.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SPAN') {
            if (post.isPublic) {
              const detailEl = document.getElementById(`detail-${post.id}`);
              if (detailEl) detailEl.classList.toggle('hidden');
            }
          }
        };

        wrapper.appendChild(bubble);
        wrapper.appendChild(creatureWrapper);
        row.appendChild(wrapper);
        stream.appendChild(row);
      });
    }

    function likePost(event, postId) {
      event.stopPropagation();
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.likes++;
        if (!post.likedCreatures) post.likedCreatures = [];
        
        const randomLover = ANIMAL_BASES[Math.floor(Math.random() * ANIMAL_BASES.length)];
        post.likedCreatures.push(randomLover);

        renderTL();
      }
    }

    function submitRecord() {
      const text = document.getElementById('diary-input').value.trim();
      const isPublic = document.getElementById('is-public').checked;
      
      const selectedEmotions = [];
      EMOTION_TYPES.forEach((emo, idx) => {
        const checked = document.getElementById(`check-emo-${idx}`).checked;
        if (checked) {
          const val = parseInt(document.getElementById(`range-emo-${idx}`).value);
          selectedEmotions.push({ name: emo, val: val });
        }
      });

      if (!text && selectedEmotions.length === 0) {
        alert("メモか気持ちを入力してください！");
        return;
      }

      // 6種類の動物ベースからランダムに決定
      const randomAnimal = ANIMAL_BASES[Math.floor(Math.random() * ANIMAL_BASES.length)];
      const faceImgName = getFaceImageName(selectedEmotions);
      const align = Math.random() > 0.5 ? 'right' : 'left';

      const newPost = {
        id: Date.now(),
        text: text || "言葉にならない気持ち",
        emotions: selectedEmotions, // 未選択の場合は空配列
        animal: randomAnimal,
        isPublic: isPublic,
        isMine: true,
        likes: 0,
        likedCreatures: [],
        align: align,
        date: "2026-10-25 19:00"
      };

      posts.push(newPost);

      if (!historyRecords[TODAY_KEY]) {
        historyRecords[TODAY_KEY] = [];
      }
      historyRecords[TODAY_KEY].push({
        text: newPost.text,
        emotions: newPost.emotions,
        animal: newPost.animal,
        likes: 0,
        time: "19:00"
      });

      // モーダル生成
      document.getElementById('modal-creature-wrapper').innerHTML = renderCreatureHtml(randomAnimal, faceImgName, "creature-container text-6xl");
      document.getElementById('modal-text').innerText = `「${randomAnimal}のココロノコ」が生まれた！`;
      document.getElementById('modal-emotions').innerText = selectedEmotions.length > 0 
        ? `気持ち: ${selectedEmotions.map(e => `${e.name}(${e.val})`).join('・')}` 
        : "気持ち: 言い表せない複雑な感情";
      document.getElementById('birth-modal').classList.remove('hidden');

      document.getElementById('diary-input').value = "";
      EMOTION_TYPES.forEach((_, idx) => {
        document.getElementById(`check-emo-${idx}`).checked = false;
        toggleSlider(idx);
      });
    }

    function closeModal() {
      document.getElementById('birth-modal').classList.add('hidden');
      switchTab('tl');
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
      } else if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
      }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById('calendar-month-title').innerText = `${currentYear}年 ${currentMonth}月`;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = "h-12 text-[#bfaea6] opacity-30";
        grid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const monthStr = currentMonth.toString().padStart(2, '0');
        const dayStr = day.toString().padStart(2, '0');
        const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

        const recordsList = historyRecords[dateKey] || [];
        const isToday = (dateKey === TODAY_KEY);

        const dayCell = document.createElement('div');
        dayCell.className = `h-12 rounded-xl p-1 flex flex-col items-center justify-between cursor-pointer transition border ${
          isToday ? 'bg-[#ffeedd] border-[#e88873] font-bold shadow-xs' : 
          recordsList.length > 0 ? 'bg-white border-[#e0c3b5] shadow-xs' : 'border-transparent hover:bg-white/40'
        }`;

        dayCell.onclick = () => selectCalendarDay(dateKey, day, recordsList);

        let creatureIcons = '';
        if (recordsList.length > 0) {
          creatureIcons = recordsList.slice(0, 3).map(r => renderCreatureHtml(r.animal, getFaceImageName(r.emotions), "creature-container-sm")).join('');
        }

        dayCell.innerHTML = `
          <span class="${isToday ? 'text-[#e88873]' : ''}">${day}</span>
          <div class="flex gap-0.5 justify-center">${creatureIcons}</div>
        `;
        grid.appendChild(dayCell);
      }

      const todayRecords = historyRecords[TODAY_KEY] || [];
      selectCalendarDay(TODAY_KEY, 25, todayRecords);
    }

    function selectCalendarDay(dateKey, day, recordsList) {
      const container = document.getElementById('day-detail-container');
      container.innerHTML = '';

      const [y, m, d] = dateKey.split('-');

      if (recordsList && recordsList.length > 0) {
        const header = document.createElement('div');
        header.className = "text-xs font-bold text-[#73584c] px-1 flex justify-between items-center";
        header.innerHTML = `<span>📅 ${y}年${parseInt(m)}月${parseInt(d)}日の記録 (${recordsList.length}件)</span>`;
        container.appendChild(header);

        recordsList.forEach((rec) => {
          const card = document.createElement('div');
          card.className = "bg-white border border-[#ebd8ce] rounded-2xl p-3 shadow-sm flex items-start gap-3";
          
          const emoTags = rec.emotions && rec.emotions.length > 0
            ? rec.emotions.map(e => {
                const name = typeof e === 'string' ? e : e.name;
                const val = typeof e === 'string' ? '' : `:${e.val}`;
                return `<span class="text-[10px] bg-[#f7eae1] text-[#785d50] px-2 py-0.5 rounded-md font-medium">#${name}${val}</span>`;
              }).join('')
            : `<span class="text-[10px] bg-[#f0e8e2] text-[#8a7a70] px-2 py-0.5 rounded-md font-medium">#言葉にならない気持ち</span>`;

          const likesCount = rec.likes !== undefined ? rec.likes : 0;
          const faceImgName = getFaceImageName(rec.emotions);

          card.innerHTML = `
            <div class="shrink-0 mt-0.5">${renderCreatureHtml(rec.animal, faceImgName, "creature-container")}</div>
            <div class="flex-1">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs text-[#a08a7e] font-medium">${rec.time || ''}</span>
                <span class="text-xs text-rose-400 font-bold bg-rose-50 px-2 py-0.5 rounded-full">♡ ${likesCount}</span>
              </div>
              <p class="text-sm font-medium text-[#4a3e3d] mb-1.5 leading-relaxed">${rec.text}</p>
              <div class="flex flex-wrap gap-1">
                ${emoTags}
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } else {
        container.innerHTML = `
          <div class="bg-white border border-[#ebd8ce] rounded-2xl p-4 shadow-sm text-center">
            <p class="text-xs text-[#a08a7e]">${y}年${parseInt(m)}月${parseInt(d)}日の記録はありません</p>
          </div>
        `;
      }
    }

    initEmotionInputs();
    switchTab('tl');
  </script>

</body>
</html>

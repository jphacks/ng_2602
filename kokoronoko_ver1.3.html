<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ココロのコ</title>
  <style>
    :root{
      --bg-dark:#1d1d1d;
      --bg-peach:#ead9cf;
      --paper:#f3f0ee;
      --line:#d5b29f;
      --text:#2f2f2f;
      --subtext:#575757;
      --soft-green:#b7d4b3;
      --cream:#f7d9b7;
      --pink:#f3d0d1;
      --gray:#d8d4d1;
      --black:#1b1b1b;
      --bubble:#f9f8f7;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
    }
    body { overflow: hidden; }

    .app {
      width: min(100vw, 430px);
      height: min(100vh, 932px);
      background: var(--bg-peach);
      border: 4px solid var(--bg-dark);
      position: relative;
      overflow: hidden;
    }

    .header {
      height: 82px;
      border-bottom: 3px solid var(--line);
      background: linear-gradient(to bottom, #efd9cb, #e4ccbe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(32px, 4vw, 42px);
      letter-spacing: 0.12em;
      font-weight: 500;
    }

    .screen {
      position: absolute;
      inset: 82px 0 86px 0;
      display: none;
      background: var(--paper);
    }
    .screen.active { display: block; }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 86px;
      border-top: 3px solid var(--line);
      background: #ebd4c4;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }

    .nav-btn {
      appearance: none;
      border: none;
      border-right: 2px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: clamp(20px, 2.8vw, 34px);
      font-family: inherit;
      cursor: pointer;
    }
    .nav-btn:last-child { border-right: none; }

    .nav-btn.record { background: #f2d6b0; }
    .nav-btn.record.active { background: #efc98d; }
    .nav-btn.past { background: #d9d6d3; }
    .nav-btn.past.active { background: #c9c5c2; }
    .nav-btn.tl { background: #dfe0de; }
    .nav-btn.tl.active { background: #d1d3d1; }

    /* 記録画面 */
    .record-screen {
      background: var(--paper);
      position: relative;
      padding: 0;
    }

    .record-form {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 0;
    }

    .record-title {
      font-size: clamp(18px, 2.8vw, 25px);
      letter-spacing: 0.08em;
      padding-top: 4px;
      margin-bottom: 10px;
      color: #3d3d3d;
    }

    .diary-input {
      width: 100%;
      flex: 1 1 auto;
      border: none;
      resize: none;
      background: rgba(255,255,255,0.18);
      border-radius: 6px;
      border: 1px solid rgba(80,80,80,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      padding: 16px 14px;
      font-size: 20px;
      line-height: 1.6;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }

    .emotion-panel {
      margin-top: 12px;
      border-top: 1px solid rgba(80,80,80,0.12);
      padding-top: 10px;
    }

    .emotion-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .emotion-option {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    .emotion-option input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #304030;
      cursor: pointer;
    }

    .emotion-label {
      display: inline-block;
      min-width: 72px;
    }

    .emotion-slider-wrap {
      display: none;
      align-items: center;
      gap: 8px;
      margin-left: 28px;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .emotion-option.checked + .emotion-slider-wrap {
      display: flex;
    }

    .emotion-slider {
      flex: 1;
      accent-color: #5d7d77;
      width: 100%;
    }

    .emotion-value {
      min-width: 42px;
      text-align: right;
      font-size: 18px;
      color: var(--subtext);
    }

    .public-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 8px 2px 0;
      color: #4d4d4d;
      font-size: 18px;
      letter-spacing: 0.04em;
    }
    .public-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #495c4f;
    }

    .submit-row {
      display: flex;
      justify-content: center;
      margin-top: 12px;
      gap: 12px;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 0;
      height: 48px;
      background: #f3d3a8;
      font-family: inherit;
      font-size: 22px;
      color: #2f2f2f;
      cursor: pointer;
    }

    /* TL */
    .tl-screen {
      background: var(--soft-green);
      overflow-y: auto;
      padding: 14px 16px 16px;
    }

    .tl-feed {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-bottom: 12px;
    }

    .entry {
      position: relative;
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .animal {
      position: absolute;
      left: 8px;
      bottom: 12px;
      font-size: 30px;
      line-height: 1;
      user-select: none;
    }

    .speech {
      position: relative;
      max-width: 72%;
      min-height: 62px;
      background: rgba(255,255,255,0.32);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 16px 62px 14px 16px;
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: 0.04em;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
      word-break: break-word;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      margin-left: 58px;
      white-space: pre-wrap;
    }

    .speech.normal { background: rgba(255,255,255,0.32); }
    .speech.private {
      background: rgba(255,255,255,0.22);
      color: rgba(30,30,30,0.8);
    }

    .speech.normal::before,
    .speech.private::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      bottom: -7px;
      right: 18px;
      transform: rotate(45deg);
      background: inherit;
      border-right: 1px solid rgba(0,0,0,0.08);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .heart-badge {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border: 3px solid rgba(0,0,0,0.8);
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
      color: #2d2d2d;
      user-select: none;
      z-index: 2;
      cursor: pointer;
      padding: 0;
    }
    .heart-badge.liked {
      background: #f7d8da;
      color: #c85b63;
      border-color: rgba(0,0,0,0.75);
    }

    .entry-detail {
      display: none;
      width: calc(100% - 80px);
      margin-left: 58px;
      margin-top: 8px;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.6;
      color: #2f2f2f;
      white-space: pre-wrap;
    }
    .entry-detail.visible { display: block; }

    /* 過去画面 */
    .past-screen {
      background: #e8d7d1;
      padding: 20px 20px 0;
      overflow: hidden;
      position: relative;
    }

    .past-topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-top: 4px;
      margin-bottom: 10px;
      min-height: 32px;
    }

    .back-calendar-btn {
      border: none;
      background: rgba(255,255,255,0.2);
      padding: 6px 10px;
      font-family: inherit;
      font-size: 18px;
      color: #2e2e2e;
      cursor: pointer;
    }

    .month-header {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 2.8vw, 32px);
      letter-spacing: 0.08em;
      margin: 6px 0 14px;
      color: #2f2f2f;
    }

    .calendar {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.18);
    }

    .day-cell {
      height: 62px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      position: relative;
      color: #2e2e2e;
    }
    .day-cell.empty {
      background: rgba(255,255,255,0.04);
      color: rgba(0,0,0,0.35);
      cursor: default;
    }
    .day-cell.has-entry::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(70,70,70,0.72);
      border-radius: 50%;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
    }
    .day-cell.selected {
      background: rgba(255,255,255,0.32);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06);
    }

    .month-switch {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 12px;
      gap: 0;
      border-top: 1px solid rgba(0,0,0,0.12);
    }

    .month-btn {
      border: none;
      background: rgba(255,255,255,0.14);
      height: 52px;
      font-size: 20px;
      font-family: inherit;
      color: #2d2d2d;
      cursor: pointer;
    }
    .month-btn:first-child { border-right: 1px solid rgba(0,0,0,0.08); }

    .entries-wrap {
      margin-top: 16px;
      max-height: 340px;
      overflow-y: auto;
      padding-bottom: 12px;
    }

    .day-entry {
      position: relative;
      min-height: 88px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .day-entry .animal {
      position: absolute;
      left: 8px;
      bottom: 12px;
      font-size: 30px;
    }

    .day-entry .bubble {
      position: relative;
      max-width: 74%;
      min-height: 62px;
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(0,0,0,0.08);
      margin-left: 58px;
      padding: 16px 62px 14px 16px;
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #2e2e2e;
    }

    .day-entry .bubble::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      bottom: -7px;
      right: 18px;
      transform: rotate(45deg);
      background: rgba(255,255,255,0.3);
      border-right: 1px solid rgba(0,0,0,0.08);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .day-entry .bubble-meta {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      opacity: 0.75;
    }

    .day-entry .emotion-chips {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .emotion-chip {
      background: rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 4px 7px;
      border-radius: 12px;
      font-size: 12px;
      color: #454545;
    }

    .day-entry .heart-badge {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border: 3px solid rgba(0,0,0,0.8);
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
      color: #2d2d2d;
      user-select: none;
      z-index: 2;
      cursor: pointer;
      padding: 0;
    }
    .day-entry .heart-badge.liked {
      background: #f7d8da;
      color: #c85b63;
      border-color: rgba(0,0,0,0.75);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">ココロのコ</header>

    <section class="screen screen-record active">
      <div class="record-form">
        <div class="record-title">どんなことがありましたか？</div>

        <textarea id="diaryInput" class="diary-input" placeholder="今日あったことを自由に書いてね"></textarea>

        <div class="emotion-panel">
          <div class="emotion-list" id="emotionList"></div>
        </div>

        <label class="public-row">
          <input id="publicToggle" type="checkbox" />
          <span>詳しい内容を公開する</span>
        </label>

        <div class="submit-row">
          <button id="saveBtn" class="submit-btn" type="button">記録</button>
        </div>
      </div>
    </section>

    <section class="screen screen-tl">
      <div class="tl-screen">
        <div id="timeline" class="tl-feed"></div>
      </div>
    </section>

    <section class="screen screen-past">
      <div class="past-screen">
        <div class="past-topbar">
          <button id="backToCalendarBtn" class="back-calendar-btn" type="button" style="display:none;">← カレンダー</button>
        </div>

        <div id="pastCalendarPanel">
          <div class="month-header" id="monthLabel"></div>
          <div id="calendar" class="calendar"></div>

          <div class="month-switch">
            <button class="month-btn" id="prevMonthBtn" type="button">先月</button>
            <button class="month-btn" id="nextMonthBtn" type="button">来月</button>
          </div>
        </div>

        <div id="pastEntriesPanel" style="display:none;">
          <div id="entriesWrap" class="entries-wrap"></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <button class="nav-btn tl" data-screen="tl" type="button">TL</button>
      <button class="nav-btn record active" data-screen="record" type="button">記録</button>
      <button class="nav-btn past" data-screen="past" type="button">過去</button>
    </footer>
  </div>

  <script>
    const EMOTIONS = ["うれしい","わくわく","あんしん","かなしい","いらいら","ゆううつ","もやもや"];
    const ANIMALS = ["🐼","🐻","🐱","🐰","🐵","🐦","🦊","🐸","🐹"];
    const STORAGE_KEY = "kokoro_entries_v5";

    const state = {
      currentScreen: "record",
      currentMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
      selectedDate: null,
      pastMode: "calendar"
    };

    function dateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${dd}`;
    }

    function getEntries() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function topEmotionLabel(emotions) {
      const rows = Object.entries(emotions || {});
      if (!rows.length) return "もやもや";
      rows.sort((a, b) => Number(b[1]) - Number(a[1]));
      return rows[0][0];
    }

    function summaryMessage(emotions) {
      const label = topEmotionLabel(emotions);
      const map = {
        "うれしい": "ちょっと嬉しいことがあったみたい",
        "わくわく": "ちょっとわくわくすることがあったみたい",
        "あんしん": "ちょっと落ち着くことがあったみたい",
        "かなしい": "ちょっと悲しいことがあったみたい",
        "いらいら": "ちょっとイライラしたことがあったみたい",
        "ゆううつ": "ちょっとゆううつなことがあったみたい",
        "もやもや": "ちょっと気になることがあったみたい"
      };
      return map[label] || "何かあったみたい";
    }

    function createEntry(text, selectedEmotions, isPublic) {
      const now = new Date();
      const emotionMap = {};
      for (const em of EMOTIONS) emotionMap[em] = 0;
      for (const item of selectedEmotions) {
        emotionMap[item.name] = Number(item.value || 50);
      }

      return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        dateKey: dateKey(now),
        createdAt: now.toISOString(),
        text,
        isPublic: !!isPublic,
        emotions: emotionMap,
        animal: ANIMALS[Math.floor(Math.random() * ANIMALS.length)],
        likedByMe: false,
        likes: 0
      };
    }

    function renderEmotionChoices() {
      const list = document.getElementById("emotionList");
      list.innerHTML = "";

      EMOTIONS.forEach((emotion) => {
        const row = document.createElement("div");
        row.className = "emotion-option";
        row.innerHTML = `
          <input type="checkbox" value="${emotion}" />
          <label class="emotion-label">${emotion}</label>
        `;

        const sliderWrap = document.createElement("div");
        sliderWrap.className = "emotion-slider-wrap";
        sliderWrap.innerHTML = `
          <input class="emotion-slider" type="range" min="1" max="100" value="50" />
          <span class="emotion-value">50</span>
        `;

        const cb = row.querySelector("input");
        cb.addEventListener("change", () => {
          row.classList.toggle("checked", cb.checked);
          sliderWrap.style.display = cb.checked ? "flex" : "none";
        });

        const slider = sliderWrap.querySelector(".emotion-slider");
        const val = sliderWrap.querySelector(".emotion-value");
        slider.addEventListener("input", () => {
          val.textContent = slider.value;
        });

        list.appendChild(row);
        list.appendChild(sliderWrap);
      });
    }

    function getSelectedEmotionValues() {
      const selected = [];
      document.querySelectorAll(".emotion-option").forEach((row) => {
        const cb = row.querySelector("input[type='checkbox']");
        if (!cb.checked) return;

        const next = row.nextElementSibling;
        const slider = next && next.querySelector(".emotion-slider");
        selected.push({
          name: cb.value,
          value: slider ? Number(slider.value) : 50
        });
      });
      return selected;
    }

    function resetRecordForm() {
      document.getElementById("diaryInput").value = "";
      document.getElementById("publicToggle").checked = false;
      document.querySelectorAll(".emotion-option").forEach((row) => {
        row.querySelector("input").checked = false;
        row.classList.remove("checked");
      });
      document.querySelectorAll(".emotion-slider-wrap").forEach((wrap) => {
        wrap.style.display = "none";
      });
    }

    function saveDiary() {
      const text = document.getElementById("diaryInput").value.trim();
      if (!text) {
        alert("どんなことがあったかを書いてね");
        return;
      }

      const selected = getSelectedEmotionValues();
      if (!selected.length) {
        alert("感情を1つ以上選んでね");
        return;
      }

      const entry = createEntry(text, selected, document.getElementById("publicToggle").checked);
      const entries = getEntries();
      entries.push(entry);
      saveEntries(entries);

      resetRecordForm();
      showScreen("tl");
      renderTimeline();
      renderCalendar();
      state.selectedDate = entry.dateKey;
      renderPastEntries();
    }

    function showScreen(name) {
      state.currentScreen = name;

      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.remove("active");
      });

      const map = {
        record: document.querySelector(".screen-record"),
        tl: document.querySelector(".screen-tl"),
        past: document.querySelector(".screen-past")
      };

      if (map[name]) map[name].classList.add("active");

      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.screen === name);
      });
    }

    function renderTimeline() {
      const entries = getEntries()
        .filter(e => e.isPublic || true)
        .sort((a, b) => Number(a.likes) - Number(b.likes));

      const timeline = document.getElementById("timeline");
      timeline.innerHTML = "";

      if (!entries.length) {
        const empty = document.createElement("div");
        empty.style.padding = "20px 12px";
        empty.style.color = "#2e2e2e";
        empty.style.fontSize = "18px";
        empty.textContent = "まだ日記がないよ";
        timeline.appendChild(empty);
        return;
      }

      entries.forEach((entry) => {
        const wrap = document.createElement("div");
        wrap.className = "entry";

        const animal = document.createElement("div");
        animal.className = "animal";
        animal.textContent = entry.animal;

        const bubble = document.createElement("div");
        bubble.className = "speech " + (entry.isPublic ? "normal" : "private");
        bubble.textContent = summaryMessage(entry.emotions);

        const detail = document.createElement("div");
        detail.className = "entry-detail";
        detail.textContent = entry.text;

        const heart = document.createElement("button");
        heart.type = "button";
        heart.className = "heart-badge" + (entry.likedByMe ? " liked" : "");
        heart.textContent = "♡";
        heart.title = "共感";
        heart.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleLike(entry.id);
        });

        let longPressTimer = null;

        bubble.addEventListener("pointerdown", () => {
          if (!entry.isPublic) return;
          longPressTimer = setTimeout(() => {
            detail.classList.add("visible");
          }, 500);
        });

        bubble.addEventListener("pointerup", () => {
          if (longPressTimer) clearTimeout(longPressTimer);
        });

        bubble.addEventListener("pointerleave", () => {
          if (longPressTimer) clearTimeout(longPressTimer);
        });

        bubble.addEventListener("click", () => {
          if (!entry.isPublic) return;
          detail.classList.toggle("visible");
        });

        wrap.appendChild(animal);
        wrap.appendChild(bubble);
        wrap.appendChild(heart);
        wrap.appendChild(detail);
        timeline.appendChild(wrap);
      });
    }

    function toggleLike(entryId) {
      const entries = getEntries();
      const target = entries.find(e => e.id === entryId);
      if (!target) return;

      target.likedByMe = !target.likedByMe;
      target.likes += target.likedByMe ? 1 : -1;
      saveEntries(entries);

      renderTimeline();
      renderCalendar();
      if (state.pastMode === "entries") renderPastEntries();
    }

    function renderCalendar() {
      const monthLabel = document.getElementById("monthLabel");
      const cal = document.getElementById("calendar");
      const year = state.currentMonth.getFullYear();
      const month = state.currentMonth.getMonth();
      monthLabel.textContent = `${year}年 ${month + 1}月`;

      const entries = getEntries();
      const firstDay = new Date(year, month, 1);
      const start = new Date(firstDay);
      start.setDate(1 - firstDay.getDay());

      cal.innerHTML = "";

      for (let i = 0; i < 42; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);

        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "day-cell";
        if (d.getMonth() !== month) cell.classList.add("empty");

        const key = dateKey(d);
        if (entries.some(entry => entry.dateKey === key)) {
          cell.classList.add("has-entry");
        }

        if (state.selectedDate === key) {
          cell.classList.add("selected");
        }

        cell.textContent = d.getDate();
        cell.addEventListener("click", () => {
          if (d.getMonth() !== month) return;
          state.selectedDate = key;
          state.pastMode = "entries";
          renderPastEntries();
        });

        cal.appendChild(cell);
      }
    }

    function renderPastEntries() {
      const panelCalendar = document.getElementById("pastCalendarPanel");
      const panelEntries = document.getElementById("pastEntriesPanel");
      const backBtn = document.getElementById("backToCalendarBtn");

      if (state.pastMode === "calendar") {
        panelCalendar.style.display = "block";
        panelEntries.style.display = "none";
        backBtn.style.display = "none";
        renderCalendar();
        return;
      }

      panelCalendar.style.display = "none";
      panelEntries.style.display = "block";
      backBtn.style.display = "inline-block";

      const selectedDate = state.selectedDate || dateKey(new Date());
      const entries = getEntries()
        .filter(e => e.dateKey === selectedDate)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      const wrap = document.getElementById("entriesWrap");
      wrap.innerHTML = "";

      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "day-entry";
        empty.innerHTML = `
          <div class="animal">🐼</div>
          <div class="bubble">
            <span class="bubble-meta">この日</span>
            この日の記録はまだありません
          </div>
        `;
        wrap.appendChild(empty);
        return;
      }

      entries.forEach((entry) => {
        const item = document.createElement("div");
        item.className = "day-entry";

        const animal = document.createElement("div");
        animal.className = "animal";
        animal.textContent = entry.animal;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = `
          <span class="bubble-meta">${entry.isPublic ? "公開" : "非公開"} · ${topEmotionLabel(entry.emotions)}</span>
          ${summaryMessage(entry.emotions)}
          <div class="emotion-chips">
            ${Object.entries(entry.emotions || {})
              .filter(([, value]) => Number(value) > 0)
              .sort((a, b) => Number(b[1]) - Number(a[1]))
              .map(([label, value]) => `<span class="emotion-chip">${label} ${value}%</span>`)
              .join("")}
          </div>
        `;

        const heart = document.createElement("button");
        heart.type = "button";
        heart.className = "heart-badge" + (entry.likedByMe ? " liked" : "");
        heart.textContent = "♡";
        heart.addEventListener("click", () => {
          toggleLike(entry.id);
        });

        item.appendChild(animal);
        item.appendChild(bubble);
        item.appendChild(heart);
        wrap.appendChild(item);
      });
    }

    function seedDemoData() {
      const entries = getEntries();
      if (entries.length) return;

      const now = new Date();
      const demo = [
        {
          text: "今日はたまたまいい話を聞いて、気分がすごく軽くなった。",
          isPublic: true,
          emotions: { "うれしい": 82, "わくわく": 50, "あんしん": 30 },
          dateKey: dateKey(new Date(now.getFullYear(), now.getMonth(), 2))
        },
        {
          text: "今日は少し疲れていて、落ち着ける時間がほしかった。",
          isPublic: false,
          emotions: { "もやもや": 72, "ゆううつ": 46, "いらいら": 33 },
          dateKey: dateKey(new Date(now.getFullYear(), now.getMonth(), 5))
        },
        {
          text: "散歩したら空気が気持ちよくて、安心した。",
          isPublic: true,
          emotions: { "あんしん": 66, "うれしい": 55 },
          dateKey: dateKey(new Date(now.getFullYear(), now.getMonth(), 9))
        }
      ];

      const seeded = demo.map(item => ({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        dateKey: item.dateKey,
        createdAt: new Date().toISOString(),
        text: item.text,
        isPublic: item.isPublic,
        emotions: item.emotions,
        animal: ANIMALS[Math.floor(Math.random() * ANIMALS.length)],
        likedByMe: false,
        likes: 0
      }));

      saveEntries(seeded);
    }

    function initialize() {
      renderEmotionChoices();
      seedDemoData();

      state.selectedDate = dateKey(new Date());
      state.pastMode = "calendar";

      renderCalendar();
      renderPastEntries();
      renderTimeline();
      showScreen("record");
    }

    document.getElementById("saveBtn").addEventListener("click", saveDiary);

    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        showScreen(btn.dataset.screen);
        if (btn.dataset.screen === "past") {
          state.pastMode = "calendar";
          renderPastEntries();
        }
      });
    });

    document.getElementById("prevMonthBtn").addEventListener("click", () => {
      state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() - 1, 1);
      state.selectedDate = null;
      renderCalendar();
    });

    document.getElementById("nextMonthBtn").addEventListener("click", () => {
      state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() + 1, 1);
      state.selectedDate = null;
      renderCalendar();
    });

    document.getElementById("backToCalendarBtn").addEventListener("click", () => {
      state.pastMode = "calendar";
      renderPastEntries();
    });

    initialize();
  </script>
</body>
</html>

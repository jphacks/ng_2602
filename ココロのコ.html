<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ココロのコ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #ECFFE8;
      color: #4a3e3d;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ヘッダーのグラデーション */
    .header-gradient {
      background: linear-gradient(180deg, #f5a373 0%, #f9d8bc 70%, rgba(249, 216, 188, 0) 100%);
    }

    /* 下側ナビゲーション：上が薄く、下が濃い不透明グラデーション */
    .nav-gradient-bottom {
      background: linear-gradient(180deg, #f9d8bc 0%, #f5a373 100%);
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }
    .floating-element {
      animation: floatSlow 3.5s ease-in-out infinite;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #e0bba8;
      border-radius: 4px;
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .speech-bubble {
      position: relative;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      border: 1px solid #e2f0e5;
    }

    /* 自分の投稿の吹き出し（薄い黄色・視認性重視） */
    .speech-bubble-mine {
      position: relative;
      background: rgba(255, 253, 235, 0.98);
      border-radius: 18px;
      border: 1px solid #f3e6b3;
      box-shadow: 0 2px 6px rgba(230, 200, 120, 0.2);
    }

    /* 動物＋表情レイヤー重ね合わせスタイル */
    .creature-container {
      position: relative;
      display: inline-block;
      width: 64px;
      height: 64px;
    }
    .creature-base-img, .creature-face-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .creature-face-img {
      z-index: 2;
    }

    /* 画像リンク切れ時に表示する絵文字のフォールバックスタイル */
    .face-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* カレンダー用アイコン（小） */
    .creature-container-sm {
      position: relative;
      display: inline-block;
      width: 16px;
      height: 16px;
    }

    /* 独立した7種類のカスタムリアクションボタン（スタンプ）スタイル */
    .custom-reaction-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fffaf5;
      border: 1px solid #ebd8ce;
      border-radius: 10px;
      padding: 4px 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .custom-reaction-btn:hover {
      background: #fdf2e9;
      transform: translateY(-1px);
    }
    .custom-reaction-btn:active {
      transform: scale(0.92);
      background: #f7ebd0;
    }
    .custom-reaction-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    /* ロゴ画像スタイル */
    .logo-img {
      max-width: 220px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      mix-blend-mode: multiply;
    }

    /* ナビゲーションアイコン画像スタイル（大サイズ：高さ約140px） */
    .nav-img {
      height: 140px;
      width: auto;
      object-fit: contain;
      transition: transform 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
    }
    .nav-img:active {
      transform: scale(0.95);
    }
    .nav-inactive {
      opacity: 0.55;
    }
    .nav-active {
      opacity: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-[#ECFFE8]">

  <div id="app-wrapper" class="w-full max-w-md bg-[#ECFFE8] min-h-screen flex flex-col justify-between shadow-2xl relative overflow-hidden">

    <!-- ヘッダー (ロゴ.png) -->
    <header class="header-gradient pt-4 pb-2 px-4 text-center z-10 sticky top-0 flex flex-col items-center justify-center">
      <img src="ロゴ.png" alt="ココロのコ" class="logo-img" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'text-2xl font-black text-[#7a4838]\'>ココロ♡のコ</div>';">
    </header>

    <!-- メインコンテンツ -->
    <main id="main-content" class="flex-1 relative overflow-y-auto pb-36 bg-[#ECFFE8]">

      <!-- ================= TL（広場） ================= -->
      <section id="tab-tl" class="min-h-full bg-[#ECFFE8] p-4 flex flex-col items-center">
        <!-- タイムラインエリア -->
        <div id="tl-stream" class="w-full flex flex-col gap-4 mt-2"></div>
      </section>

      <!-- ================= 記録 (かく) ================= -->
      <section id="tab-record" class="hidden min-h-full bg-[#fdfbf7] p-5 flex flex-col gap-5">
        
        <div class="text-center my-2">
          <p class="text-lg font-medium text-[#73584c]">どんなことがありましたか？</p>
          <p class="text-xs text-[#a08a7e] mt-1">短くても長くなっても大丈夫です</p>
        </div>

        <div class="bg-white/90 border border-[#eddcd2] rounded-2xl p-3 shadow-sm">
          <textarea id="diary-input" rows="3" 
            placeholder="今日あったことやメモを書いてみよう..." 
            class="w-full bg-transparent resize-none border-none focus:outline-none text-sm text-[#4a3e3d] placeholder-[#c4b2a8]"></textarea>
        </div>

        <!-- 気持ちの選択 ＆ 1〜5段階スライダー -->
        <div class="bg-white/80 border border-[#f0e3da] rounded-2xl p-4 shadow-sm">
          <p class="text-sm font-bold text-[#6b5246] mb-1 text-center">どんな気持ちでしたか？</p>
          <p class="text-[11px] text-[#a08a7e] mb-3 text-center">当てはまる感情にチェックを入れて、強さ（1〜5）を選んでください</p>
          
          <div id="emotions-container" class="flex flex-col gap-2.5">
            <!-- JSで感情スライダー行を生成 -->
          </div>
        </div>

        <div class="flex items-center justify-center gap-2 py-1">
          <input type="checkbox" id="is-public" checked class="w-4 h-4 accent-[#e88873] rounded cursor-pointer">
          <label for="is-public" class="text-sm font-medium text-[#6e584c] cursor-pointer">詳しい内容を公開する</label>
        </div>

        <button onclick="submitRecord()" class="w-2/3 mx-auto bg-[#eba496] text-white font-bold py-3 px-6 rounded-full shadow-md hover:bg-[#e49283] active:scale-95 transition text-center tracking-wider mt-2">
          記録
        </button>

      </section>

      <!-- ================= 過去 (思い出 / カレンダー) ================= -->
      <section id="tab-history" class="hidden min-h-full bg-[#fdfbf7] p-4">
        
        <div class="text-center mb-3">
          <h2 class="text-lg font-bold text-[#6b5246] tracking-wide">カレンダー</h2>
        </div>

        <div class="bg-[#ebdcd5]/70 border border-[#e2cfc7] rounded-2xl p-4 shadow-sm">
          
          <div class="flex justify-between items-center mb-4 px-2">
            <span id="calendar-month-title" class="text-md font-bold text-[#5e493e]">2026年 10月</span>
            <div class="flex gap-2">
              <button onclick="changeMonth(-1)" class="text-xs bg-white/90 border border-[#d9c4ba] px-3 py-1.5 rounded-lg text-[#6e584c] shadow-xs hover:bg-white active:scale-95 transition font-bold">◀</button>
              <button onclick="changeMonth(1)" class="text-xs bg-white/90 border border-[#d9c4ba] px-3 py-1.5 rounded-lg text-[#6e584c] shadow-xs hover:bg-white active:scale-95 transition font-bold">▶</button>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-[#8a7266] mb-2">
            <span class="text-rose-400">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-sky-400">土</span>
          </div>

          <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>

        </div>

        <div id="day-detail-container" class="mt-4 flex flex-col gap-2">
          <div class="bg-white border border-[#ebd8ce] rounded-2xl p-4 shadow-sm text-center">
            <p class="text-xs text-[#a08a7e]">日付をタップするとその日のすべての記録とスタンプが見られます</p>
          </div>
        </div>

      </section>

    </main>

    <!-- ボトムナビゲーション（グラデーション背景＋3つのタブ画像） -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md h-28 nav-gradient-bottom flex justify-around items-center z-30 shadow-2xl border-t border-[#f2c7a8] px-4">
      <div onclick="switchTab('tl')" class="cursor-pointer flex items-center justify-center">
        <img id="nav-tl" src="広場.png" alt="広場" class="nav-img nav-active" onerror="this.onerror=null; this.outerHTML='<span class=\'font-bold text-sm text-[#7a4838]\'>広場</span>';">
      </div>
      <div onclick="switchTab('record')" class="cursor-pointer flex items-center justify-center">
        <img id="nav-record" src="かく.png" alt="かく" class="nav-img nav-inactive" onerror="this.onerror=null; this.outerHTML='<span class=\'font-bold text-sm text-[#7a4838]\'>かく</span>';">
      </div>
      <div onclick="switchTab('history')" class="cursor-pointer flex items-center justify-center">
        <img id="nav-history" src="思い出.png" alt="思い出" class="nav-img nav-inactive" onerror="this.onerror=null; this.outerHTML='<span class=\'font-bold text-sm text-[#7a4838]\'>思い出</span>';">
      </div>
    </nav>

    <!-- 誕生演出モーダル -->
    <div id="birth-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl animate-pop border border-[#edd3c5] flex flex-col items-center">
        <h3 class="text-lg font-bold text-[#73584c] mb-1">ココロノコが誕生！</h3>
        <div id="modal-creature-wrapper" class="my-4 floating-element flex justify-center">
          <!-- JSで動物＋表情レイヤーを挿入 -->
        </div>
        <p id="modal-text" class="text-sm text-[#5a483e] font-medium mb-1">「何やら新しいココロが生まれたよ」</p>
        <p id="modal-emotions" class="text-xs text-[#9c8477] mb-4"></p>
        <button onclick="closeModal()" class="w-full bg-[#e88873] text-white font-bold py-2.5 rounded-xl shadow hover:bg-[#e07761] transition">
          広場へ連れていく
        </button>
      </div>
    </div>

  </div>

  <script>
    const ANIMAL_BASES = ["いぬ", "うさぎ", "くま", "とら", "オオカミ", "リス"];
    
    // ご指定の7種類のスタンプ画像リスト
    const CUSTOM_REACTIONS = [
      "無題2194_20261025110110.png",
      "無題2194_20261025110128.png",
      "無題2194_20261025110133.png",
      "無題2194_20261025110140.png",
      "無題2194_20261025110146.png",
      "無題2194_20261025110151.png",
      "無題2194_20261025110222.png"
    ];

    const EMOTION_TYPES = [
      "うれしい", "かなしい", "たのしい", "わくわく", "むかつく",
      "あんしん", "もやもや", "ゆううつ", "くるしい", "はずかしい"
    ];

    let currentYear = 2026;
    let currentMonth = 10;
    const TODAY_KEY = "2026-10-25";

    function getFaceImageName(emotions) {
      if (!emotions || emotions.length === 0) {
        return "もやもや.png";
      }

      let mainEmotion = emotions[0];
      if (typeof mainEmotion === 'object' && mainEmotion.name) {
        let maxVal = -1;
        emotions.forEach(e => {
          if (e.val > maxVal) {
            maxVal = e.val;
            mainEmotion = e.name;
          }
        });
      }

      const emoStr = typeof mainEmotion === 'string' ? mainEmotion : mainEmotion.name;

      if (["うれしい", "たのしい", "わくわく", "あんしん"].includes(emoStr)) {
        return "うれしい.png";
      } else if (["もやもや", "ゆううつ"].includes(emoStr)) {
        return "もやもや.png";
      } else if (["くるしい", "かなしい"].includes(emoStr)) {
        return "かなしい.png";
      } else if (emoStr === "はずかしい") {
        return "はずかしい.png";
      } else if (emoStr === "むかつく") {
        return "むかつく.png";
      }

      return "もやもや.png";
    }

    function getSummaryText(emotions) {
      if (!emotions || emotions.length === 0) {
        return "言葉にならない、少し複雑なココロを感じているみたい";
      }

      const emotionNames = emotions.map(e => typeof e === 'string' ? e : e.name);

      if (emotionNames.includes("かなしい") || emotionNames.includes("ゆううつ") || emotionNames.includes("くるしい")) {
        return "何やら悲しいことがあったみたい";
      } else if (emotionNames.includes("うれしい") || emotionNames.includes("たのしい") || emotionNames.includes("わくわく")) {
        return "何やら嬉しいことがあったみたい";
      } else if (emotionNames.includes("もやもや") || emotionNames.includes("むかつく")) {
        return "何やらモヤモヤしているみたい";
      } else if (emotionNames.includes("はずかしい")) {
        return "何やら照れているみたい";
      } else if (emotionNames.includes("あんしん")) {
        return "ほっと一安心しているみたい";
      }

      return "言葉にならない、少し複雑なココロを感じているみたい";
    }

    function renderCreatureHtml(animalBase, faceImgName, sizeClass = "creature-container") {
      const baseSrc = `${animalBase}.png`;
      const faceSrc = faceImgName;

      const fallbackEmoji = faceImgName === "うれしい.png" ? "😊" :
                            faceImgName === "かなしい.png" ? "😢" :
                            faceImgName === "はずかしい.png" ? "😳" :
                            faceImgName === "むかつく.png" ? "😠" : "💭";

      return `
        <div class="${sizeClass}">
          <img src="${baseSrc}" alt="${animalBase}" class="creature-base-img" 
               onerror="this.style.display='none'; this.nextElementSibling.style.position='static';">
          <img src="${faceSrc}" alt="表情" class="creature-face-img" 
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="face-fallback text-xl" style="display:none;">${fallbackEmoji}</div>
        </div>
      `;
    }

    let posts = [
      { id: 101, text: "課題で少しミスをして落ち込んだ...", emotions: [{name:"かなしい", val:4}, {name:"ゆううつ", val:3}], animal: "オオカミ", isPublic: true, isMine: false, likes: 0, reactions: {0:1, 2:1}, date: "2026-10-24 14:20", align: "left" },
      { id: 102, text: "夕方の空がとってもキレイだった！", emotions: [{name:"あんしん", val:5}], animal: "いぬ", isPublic: true, isMine: true, likes: 3, reactions: {0:2, 4:1, 6:3}, date: "2026-10-25 17:30", align: "left" },
      { id: 103, text: "なんだか理由も分からずぼんやり考えごと...", emotions: [], animal: "くま", isPublic: false, isMine: false, likes: 1, reactions: {1:1}, date: "2026-10-25 08:00", align: "right" },
      { id: 104, text: "欲しかった本を手に入れた！読むのが楽しみ", emotions: [{name:"わくわく", val:5}], animal: "うさぎ", isPublic: true, isMine: false, likes: 2, reactions: {3:2, 5:1}, date: "2026-10-25 09:15", align: "right" }
    ];

    let historyRecords = {
      "2026-08-10": [{ id: 1, text: "夏休みのドライブに行ってきた！海がきれいだった", emotions: [{name:"たのしい", val:5}, {name:"わくわく", val:4}], animal: "とら", likes: 4, reactions: {0:1, 1:2}, time: "14:00" }],
      "2026-08-15": [{ id: 2, text: "かき氷を食べた。すごく冷たくて夏を感じた！", emotions: [{name:"うれしい", val:4}], animal: "リス", likes: 2, reactions: {2:1}, time: "16:20" }],
      "2026-08-28": [{ id: 3, text: "夏休みの宿題がまだ終わらなくて焦ってきた...", emotions: [{name:"ゆううつ", val:4}, {name:"くるしい", val:3}], animal: "オオカミ", likes: 1, reactions: {3:1}, time: "21:00" }],
      "2026-09-05": [{ id: 4, text: "秋の風が少し吹き始めて気持ちいい", emotions: [{name:"あんしん", val:4}], animal: "いぬ", likes: 3, reactions: {4:2}, time: "17:40" }],
      "2026-09-12": [{ id: 5, text: "欲しかった洋服を買いに行けた！", emotions: [{name:"うれしい", val:5}, {name:"たのしい", val:4}], animal: "うさぎ", likes: 5, reactions: {5:3}, time: "13:10" }],
      "2026-09-20": [{ id: 6, text: "夜遅くまでプログラミングの練習をした", emotions: [{name:"もやもや", val:2}, {name:"わくわく", val:4}], animal: "くま", likes: 2, reactions: {6:1}, time: "23:15" }],
      "2026-09-27": [{ id: 7, text: "友だちとカラオケに行って大声で歌った！", emotions: [{name:"たのしい", val:5}], animal: "とら", likes: 6, reactions: {0:2, 1:1}, time: "19:30" }],
      "2026-10-15": [{ id: 8, text: "久しぶりにカフェでゆっくり読書した", emotions: [{name:"あんしん", val:4}], animal: "リス", likes: 2, reactions: {2:1}, time: "15:00" }],
      "2026-10-18": [{ id: 9, text: "新しい曲を聴いて気分が上がった！", emotions: [{name:"たのしい", val:5}], animal: "いぬ", likes: 4, reactions: {3:2}, time: "11:20" }],
      "2026-10-21": [{ id: 10, text: "ちょっと失敗してモヤモヤした日", emotions: [{name:"もやもや", val:3}], animal: "くま", likes: 1, reactions: {4:1}, time: "20:10" }],
      "2026-10-22": [{ id: 11, text: "散歩中に可愛い野良猫に出会えた", emotions: [{name:"うれしい", val:4}], animal: "うさぎ", likes: 3, reactions: {5:2}, time: "16:45" }],
      "2026-10-25": [
        { id: 102, text: "夕方の空がとってもキレイだった！", emotions: [{name:"あんしん", val:5}], animal: "いぬ", likes: 3, reactions: {0:2, 4:1, 6:3}, time: "17:30" }
      ]
    };

    let currentTLOrder = [];

    function initEmotionInputs() {
      const container = document.getElementById('emotions-container');
      container.innerHTML = '';

      EMOTION_TYPES.forEach((emo, idx) => {
        const row = document.createElement('div');
        row.className = "flex items-center justify-between gap-2 p-2 rounded-xl bg-[#fbf6f1] border border-[#f5e9df]";
        
        row.innerHTML = `
          <label class="flex items-center gap-2 cursor-pointer shrink-0 w-28">
            <input type="checkbox" id="check-emo-${idx}" value="${emo}" onchange="toggleSlider(${idx})" class="emotion-check accent-[#ee8572] w-4 h-4">
            <span class="text-sm font-medium text-[#5a483e]">${emo}</span>
          </label>
          <div class="flex items-center gap-2 flex-1 opacity-40 transition-opacity" id="slider-box-${idx}">
            <input type="range" id="range-emo-${idx}" min="1" max="5" value="3" disabled oninput="updateVal(${idx})" class="w-full accent-[#e88873] h-1.5 bg-[#ebdcd5] rounded-lg appearance-none cursor-pointer">
            <span id="val-emo-${idx}" class="text-xs font-bold text-[#73584c] w-4 text-right">3</span>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function toggleSlider(idx) {
      const checked = document.getElementById(`check-emo-${idx}`).checked;
      const box = document.getElementById(`slider-box-${idx}`);
      const range = document.getElementById(`range-emo-${idx}`);
      
      if (checked) {
        box.classList.remove('opacity-40');
        range.disabled = false;
      } else {
        box.classList.add('opacity-40');
        range.disabled = true;
      }
    }

    function updateVal(idx) {
      const val = document.getElementById(`range-emo-${idx}`).value;
      document.getElementById(`val-emo-${idx}`).innerText = val;
    }

    function switchTab(tabName) {
      const main = document.getElementById('main-content');
      const wrapper = document.getElementById('app-wrapper');

      document.getElementById('tab-tl').classList.add('hidden');
      document.getElementById('tab-record').classList.add('hidden');
      document.getElementById('tab-history').classList.add('hidden');

      const navTl = document.getElementById('nav-tl');
      const navRecord = document.getElementById('nav-record');
      const navHistory = document.getElementById('nav-history');

      if (navTl) { navTl.className = "nav-img " + (tabName === 'tl' ? "nav-active" : "nav-inactive"); }
      if (navRecord) { navRecord.className = "nav-img " + (tabName === 'record' ? "nav-active" : "nav-inactive"); }
      if (navHistory) { navHistory.className = "nav-img " + (tabName === 'history' ? "nav-active" : "nav-inactive"); }

      if (tabName === 'tl') {
        document.getElementById('tab-tl').classList.remove('hidden');
        main.style.backgroundColor = '#ECFFE8';
        wrapper.style.backgroundColor = '#ECFFE8';
        
        sortTLOrder();
        renderTL();
      } else if (tabName === 'record') {
        document.getElementById('tab-record').classList.remove('hidden');
        main.style.backgroundColor = '#fdfbf7';
        wrapper.style.backgroundColor = '#fdfbf7';
      } else if (tabName === 'history') {
        document.getElementById('tab-history').classList.remove('hidden');
        main.style.backgroundColor = '#fdfbf7';
        wrapper.style.backgroundColor = '#fdfbf7';
        renderCalendar();
      }
    }

    function sortTLOrder() {
      const sorted = [...posts].sort((a, b) => a.likes - b.likes);
      currentTLOrder = sorted.map(p => p.id);
    }

    function renderTL() {
      const stream = document.getElementById('tl-stream');
      stream.innerHTML = '';

      const displayPosts = currentTLOrder
        .map(id => posts.find(p => p.id === id))
        .filter(p => p !== undefined);

      displayPosts.forEach((post, index) => {
        const row = document.createElement('div');
        row.className = `w-full flex ${post.align === 'right' ? 'justify-end' : 'justify-start'} my-1`;

        const wrapper = document.createElement('div');
        wrapper.className = "flex flex-col items-center max-w-[85%] floating-element cursor-pointer";
        wrapper.style.animationDelay = `${(index % 3) * 0.8}s`;

        const summaryText = getSummaryText(post.emotions);
        const faceImgName = getFaceImageName(post.emotions);

        const bubble = document.createElement('div');
        bubble.className = (post.isMine ? "speech-bubble-mine" : "speech-bubble") + " text-[#4a3e3d] text-xs font-bold px-3.5 py-2.5 shadow-md w-full text-center mb-1 flex flex-col gap-1.5 cursor-pointer";

        const heartDisplay = post.isMine ? `♡ <span id="like-count-${post.id}" class="ml-1">${post.likes}</span>` : `♡`;

        const publicIndicator = post.isPublic 
          ? `<div class="text-[10px] text-[#8a9a86] font-normal flex items-center justify-center gap-1 mt-0.5"><span>タップで詳細＆スタンプ</span><span class="text-[9px]">▼</span></div>` 
          : `<div class="text-[10px] text-[#a08a7e] font-normal flex items-center justify-center gap-1 mt-0.5"><span>🔒 秘密の記録</span></div>`;

        const emoTagsHtml = post.emotions && post.emotions.length > 0 
          ? post.emotions.map(e => {
              const name = typeof e === 'string' ? e : e.name;
              const val = typeof e === 'string' ? '' : `:${e.val}`;
              return `<span class="text-[10px] bg-[#f7eae1] text-[#785d50] px-1.5 py-0.5 rounded">#${name}${val}</span>`;
            }).join('')
          : `<span class="text-[10px] bg-[#f0e8e2] text-[#8a7a70] px-1.5 py-0.5 rounded">#言葉にならない気持ち</span>`;

        // 7種類のカスタムリアクションボタン群（広場からスタンプが押せる）
        function getReactionsHtml(postId, reactionsObj) {
          if (!reactionsObj) reactionsObj = {};
          let html = '<div class="flex items-center gap-1.5 overflow-x-auto pt-2 pb-1 justify-center flex-wrap">';
          CUSTOM_REACTIONS.forEach((imgSrc, rIdx) => {
            const count = reactionsObj[rIdx] || 0;
            html += `
              <button onclick="clickReaction(event, ${postId}, ${rIdx})" class="custom-reaction-btn" title="スタンプを押す">
                <img src="${imgSrc}" class="custom-reaction-img" onerror="this.style.display='none';">
                <span id="react-count-${postId}-${rIdx}" class="text-[10px] text-[#73584c] font-bold mt-0.5">${count}</span>
              </button>
            `;
          });
          html += '</div>';
          return html;
        }

        const reactionsHtml = getReactionsHtml(post.id, post.reactions);

        bubble.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="text-left leading-relaxed pointer-events-none">${summaryText}</span>
            <button onclick="likePost(event, ${post.id})" class="text-rose-400 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-full transition flex items-center text-[11px] font-bold shrink-0 z-10">
              ${heartDisplay}
            </button>
          </div>
          <div class="pointer-events-none">${publicIndicator}</div>
          <div id="detail-${post.id}" class="hidden text-left pt-2 border-t border-black/5 text-xs font-normal text-[#5a483e] animate-pop pointer-events-none">
            <p class="mb-1 leading-relaxed">${post.text}</p>
            <div class="flex flex-wrap gap-1 mt-1 mb-1">
              ${emoTagsHtml}
            </div>
            <!-- 7種類のカスタムリアクションボタン（広場で押せる） -->
            <div class="pointer-events-auto mt-2">
              <p class="text-[10px] text-[#8a7266] font-bold text-center mb-1">スタンプを押して気持ちを送る</p>
              ${reactionsHtml}
            </div>
          </div>
        `;

        const likesContainer = document.createElement('div');
        likesContainer.id = `likes-container-${post.id}`;
        likesContainer.className = "flex items-center justify-end gap-1.5 pt-1 border-t border-black/5 text-[10px] text-[#71584c] pointer-events-none";
        
        let hasReactions = false;
        let summaryReactionsHtml = '';
        if (post.reactions) {
          CUSTOM_REACTIONS.forEach((imgSrc, rIdx) => {
            const cnt = post.reactions[rIdx] || 0;
            if (cnt > 0) {
              hasReactions = true;
              summaryReactionsHtml += `<div class="flex items-center gap-0.5 bg-white/70 px-1.5 py-0.5 rounded border border-black/5"><img src="${imgSrc}" style="width:14px;height:14px;object-fit:contain;"><span class="font-bold">${cnt}</span></div>`;
            }
          });
        }

        if (hasReactions) {
          likesContainer.innerHTML = `<span class="opacity-75">スタンプ:</span> <div class="flex gap-1 items-center flex-wrap">${summaryReactionsHtml}</div>`;
        } else {
          likesContainer.style.display = 'none';
        }
        bubble.appendChild(likesContainer);

        const creatureWrapper = document.createElement('div');
        creatureWrapper.className = "mt-0.5 pointer-events-none";
        creatureWrapper.innerHTML = renderCreatureHtml(post.animal, faceImgName);

        wrapper.onclick = (e) => {
          if (e.target.closest('button')) return;
          if (post.isPublic) {
            const detailEl = document.getElementById(`detail-${post.id}`);
            if (detailEl) detailEl.classList.toggle('hidden');
          }
        };

        wrapper.appendChild(bubble);
        wrapper.appendChild(creatureWrapper);
        row.appendChild(wrapper);
        stream.appendChild(row);
      });
    }

    // ハートボタンクリック時
    function likePost(event, postId) {
      event.stopPropagation();
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.likes++;
        if (post.isMine) {
          for (let dateKey in historyRecords) {
            const hRec = historyRecords[dateKey].find(r => r.id === postId);
            if (hRec) {
              hRec.likes = post.likes;
              break;
            }
          }
        }

        const countEl = document.getElementById(`like-count-${postId}`);
        if (countEl) {
          countEl.innerText = post.likes;
        }
      }
    }

    // 広場（TL）で7種類のカスタムリアクションボタンをクリック（スタンプカウント+1）
    function clickReaction(event, postId, rIdx) {
      event.stopPropagation();
      const post = posts.find(p => p.id === postId);
      if (post) {
        if (!post.reactions) post.reactions = {};
        post.reactions[rIdx] = (post.reactions[rIdx] || 0) + 1;

        // 自分の投稿であれば履歴（思い出）側にも即時同期
        if (post.isMine) {
          for (let dateKey in historyRecords) {
            const hRec = historyRecords[dateKey].find(r => r.id === postId);
            if (hRec) {
              if (!hRec.reactions) hRec.reactions = {};
              hRec.reactions[rIdx] = post.reactions[rIdx];
              break;
            }
          }
        }

        // スタンプボタン上の表示を更新
        const countSpan = document.getElementById(`react-count-${postId}-${rIdx}`);
        if (countSpan) {
          countSpan.innerText = post.reactions[rIdx];
        }

        // 投稿カード下部のスタンプサマリー表示もリアルタイム更新
        const likesContainer = document.getElementById(`likes-container-${postId}`);
        if (likesContainer) {
          let hasReactions = false;
          let summaryReactionsHtml = '';
          CUSTOM_REACTIONS.forEach((imgSrc, i) => {
            const cnt = post.reactions[i] || 0;
            if (cnt > 0) {
              hasReactions = true;
              summaryReactionsHtml += `<div class="flex items-center gap-0.5 bg-white/70 px-1.5 py-0.5 rounded border border-black/5"><img src="${imgSrc}" style="width:14px;height:14px;object-fit:contain;"><span class="font-bold">${cnt}</span></div>`;
            }
          });
          if (hasReactions) {
            likesContainer.innerHTML = `<span class="opacity-75">スタンプ:</span> <div class="flex gap-1 items-center flex-wrap">${summaryReactionsHtml}</div>`;
            likesContainer.style.display = 'flex';
          }
        }
      }
    }

    function submitRecord() {
      const text = document.getElementById('diary-input').value.trim();
      const isPublic = document.getElementById('is-public').checked;
      
      const selectedEmotions = [];
      EMOTION_TYPES.forEach((emo, idx) => {
        const checked = document.getElementById(`check-emo-${idx}`).checked;
        if (checked) {
          const val = parseInt(document.getElementById(`range-emo-${idx}`).value);
          selectedEmotions.push({ name: emo, val: val });
        }
      });

      if (!text && selectedEmotions.length === 0) {
        alert("メモか気持ちを入力してください！");
        return;
      }

      const randomAnimal = ANIMAL_BASES[Math.floor(Math.random() * ANIMAL_BASES.length)];
      const faceImgName = getFaceImageName(selectedEmotions);
      const align = Math.random() > 0.5 ? 'right' : 'left';
      const newId = Date.now();

      const newPost = {
        id: newId,
        text: text || "言葉にならない気持ち",
        emotions: selectedEmotions,
        animal: randomAnimal,
        isPublic: isPublic,
        isMine: true,
        likes: 0,
        reactions: {},
        align: align,
        date: "2026-10-25 19:00"
      };

      posts.push(newPost);

      if (!historyRecords[TODAY_KEY]) {
        historyRecords[TODAY_KEY] = [];
      }
      historyRecords[TODAY_KEY].push({
        id: newId,
        text: newPost.text,
        emotions: newPost.emotions,
        animal: newPost.animal,
        likes: 0,
        reactions: {},
        time: "19:00"
      });

      document.getElementById('modal-creature-wrapper').innerHTML = renderCreatureHtml(randomAnimal, faceImgName, "creature-container text-6xl");
      document.getElementById('modal-text').innerText = `「${randomAnimal}のココロノコ」が生まれた！`;
      document.getElementById('modal-emotions').innerText = selectedEmotions.length > 0 
        ? `気持ち: ${selectedEmotions.map(e => `${e.name}(${e.val})`).join('・')}` 
        : "気持ち: 言い表せない複雑な感情";
      document.getElementById('birth-modal').classList.remove('hidden');

      document.getElementById('diary-input').value = "";
      EMOTION_TYPES.forEach((_, idx) => {
        document.getElementById(`check-emo-${idx}`).checked = false;
        toggleSlider(idx);
      });
    }

    function closeModal() {
      document.getElementById('birth-modal').classList.add('hidden');
      switchTab('tl');
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
      } else if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
      }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById('calendar-month-title').innerText = `${currentYear}年 ${currentMonth}月`;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = "h-12 text-[#bfaea6] opacity-30";
        grid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const monthStr = currentMonth.toString().padStart(2, '0');
        const dayStr = day.toString().padStart(2, '0');
        const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

        const recordsList = historyRecords[dateKey] || [];
        const isToday = (dateKey === TODAY_KEY);

        const dayCell = document.createElement('div');
        dayCell.className = `h-12 rounded-xl p-1 flex flex-col items-center justify-between cursor-pointer transition border ${
          isToday ? 'bg-[#ffeedd] border-[#e88873] font-bold shadow-xs' : 
          recordsList.length > 0 ? 'bg-white border-[#e0c3b5] shadow-xs' : 'border-transparent hover:bg-white/40'
        }`;

        dayCell.onclick = () => selectCalendarDay(dateKey, day, recordsList);

        let creatureIcons = '';
        if (recordsList.length > 0) {
          creatureIcons = `<div class="flex gap-0.5 justify-center items-center">` + 
            recordsList.slice(0, 3).map(r => renderCreatureHtml(r.animal, getFaceImageName(r.emotions), "creature-container-sm")).join('') + 
            `</div>`;
        }

        dayCell.innerHTML = `
          <span class="${isToday ? 'text-[#e88873]' : ''}">${day}</span>
          ${creatureIcons}
        `;
        grid.appendChild(dayCell);
      }

      const todayRecords = historyRecords[TODAY_KEY] || [];
      selectCalendarDay(TODAY_KEY, 25, todayRecords);
    }

    // 思い出（過去）画面で各投稿に押してもらったスタンプ数の確認ができる
    function selectCalendarDay(dateKey, day, recordsList) {
      const container = document.getElementById('day-detail-container');
      container.innerHTML = '';

      const [y, m, d] = dateKey.split('-');

      if (recordsList && recordsList.length > 0) {
        const header = document.createElement('div');
        header.className = "text-xs font-bold text-[#73584c] px-1 flex justify-between items-center";
        header.innerHTML = `<span>📅 ${y}年${parseInt(m)}月${parseInt(d)}日の記録 (${recordsList.length}件)</span>`;
        container.appendChild(header);

        recordsList.forEach((rec) => {
          const card = document.createElement('div');
          card.className = "bg-white border border-[#ebd8ce] rounded-2xl p-3 shadow-sm flex flex-col gap-2";
          
          const emoTags = rec.emotions && rec.emotions.length > 0
            ? rec.emotions.map(e => {
                const name = typeof e === 'string' ? e : e.name;
                const val = typeof e === 'string' ? '' : `:${e.val}`;
                return `<span class="text-[10px] bg-[#f7eae1] text-[#785d50] px-2 py-0.5 rounded-md font-medium">#${name}${val}</span>`;
              }).join('')
            : `<span class="text-[10px] bg-[#f0e8e2] text-[#8a7a70] px-2 py-0.5 rounded-md font-medium">#言葉にならない気持ち</span>`;

          const likesCount = rec.likes !== undefined ? rec.likes : 0;
          const faceImgName = getFaceImageName(rec.emotions);

          // 思い出画面でのスタンプ獲得数一覧表示
          let historyReactionsHtml = '';
          if (rec.reactions) {
            let hasAny = false;
            CUSTOM_REACTIONS.forEach((imgSrc, rIdx) => {
              const cnt = rec.reactions[rIdx] || 0;
              if (cnt > 0) {
                hasAny = true;
                historyReactionsHtml += `
                  <div class="flex items-center gap-1 bg-[#fbf6f1] border border-[#ebd8ce] px-2 py-1 rounded-lg">
                    <img src="${imgSrc}" style="width:22px;height:22px;object-fit:contain;">
                    <span class="text-xs font-bold text-[#73584c]">${cnt}</span>
                  </div>
                `;
              }
            });
            if (hasAny) {
              historyReactionsHtml = `<div class="flex flex-wrap gap-1.5 mt-2 pt-2 border-t border-black/5 items-center"><span class="text-[11px] text-[#8a7266] font-medium mr-1">押してもらったスタンプ:</span>` + historyReactionsHtml + `</div>`;
            } else {
              historyReactionsHtml = `<div class="mt-2 pt-2 border-t border-black/5 text-[11px] text-[#a08a7e]">まだスタンプは届いていません</div>`;
            }
          }

          card.innerHTML = `
            <div class="flex items-start gap-3">
              <div class="shrink-0 mt-0.5">${renderCreatureHtml(rec.animal, faceImgName, "creature-container")}</div>
              <div class="flex-1">
                <div class="flex justify-between items-center mb-1">
                  <span class="text-xs text-[#a08a7e] font-medium">${rec.time || ''}</span>
                  <span class="text-xs text-rose-400 font-bold bg-rose-50 px-2 py-0.5 rounded-full">♡ ${likesCount}</span>
                </div>
                <p class="text-sm font-medium text-[#4a3e3d] mb-1.5 leading-relaxed">${rec.text}</p>
                <div class="flex flex-wrap gap-1">
                  ${emoTags}
                </div>
              </div>
            </div>
            ${historyReactionsHtml}
          `;
          container.appendChild(card);
        });
      } else {
        container.innerHTML = `
          <div class="bg-white border border-[#ebd8ce] rounded-2xl p-4 shadow-sm text-center">
            <p class="text-xs text-[#a08a7e]">${y}年${parseInt(m)}月${parseInt(d)}日の記録はありません</p>
          </div>
        `;
      }
    }

    initEmotionInputs();
    sortTLOrder();
    switchTab('tl');
  </script>

</body>
</html>
